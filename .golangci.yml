# Linter configuration for golangci-lint (v1 format).
# Run with: golangci-lint run
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

linters-settings:
  gosec:
    excludes:
      # G304: the configuration path is supplied by the operator on the
      # command line and is read on purpose.
      - G304

issues:
  exclude-rules:
    # Test helpers legitimately ignore errors on cleanup paths.
    - path: _test\.go
      linters:
        - gosec
