apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-server
  labels:
    app.kubernetes.io/name: microservice-server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: microservice-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microservice-server
    spec:
      # The application drains in-flight requests on SIGTERM and exits within
      # HTTP_SHUTDOWN_TIMEOUT; the grace period must be longer than that.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: microservice-server
      containers:
        - name: server
          image: microservice-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: microservice-server
            - secretRef:
                name: microservice-server
          env:
            # The configuration file is mounted from the image; these values
            # are applied on top of it.
            - name: HTTP_SHUTDOWN_TIMEOUT
              value: "15s"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                # Give the endpoint controller time to remove this pod from
                # the service before the process starts draining.
                command: ["/bin/sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
