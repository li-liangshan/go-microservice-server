service_name: go-microservice
version: 1.0.0
log_level: info
log_format: json

http:
  addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 10s
  shutdown_timeout: 10s
  readiness_timeout: 2s
  max_header_bytes: 1048576
  max_body_bytes: 1048576
  auth_token: ""

database:
  driver: mysql
  host: localhost
  port: 3306
  user: root
  password: admin
  name: microservice
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  connect_timeout: 5s
  tls_mode: "false"

telemetry:
  enabled: true
  endpoint: localhost:4317
  insecure: true
  environment: development
  sample_ratio: 1.0
  export_interval: 10s
  export_timeout: 5s
  shutdown_timeout: 10s
  headers: {}
