service_name: go-microservice
version: 1.0.0
log_level: info
log_format: json

http:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

database:
  driver: postgres
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: microservice
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
