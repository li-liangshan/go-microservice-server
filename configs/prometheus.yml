global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The collector's Prometheus exporter exposes the OTLP metrics produced by
  # the service (HTTP server metrics, db.sql.* metrics, pool gauges).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
